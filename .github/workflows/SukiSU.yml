name: Build Kernel Xiaomi Lisa (SukiSU-Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout builder repo
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache clang curl flex git \
          libssl-dev libelf-dev lld llvm \
          python3 python-is-python3 \
          unzip zip

    - name: Setup Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

    - name: Clone kernel source (PixelExperience - lisa)
      run: |
        git clone --depth=1 https://github.com/PixelExperience-Devices/kernel_xiaomi_lisa.git kernel
        cd kernel

    - name: Integrate SukiSU-Ultra (built-in)
      working-directory: kernel
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin

    - name: Configure kernel
      working-directory: kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make lisa_defconfig

        scripts/config --enable CONFIG_KSU
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        scripts/config --disable CONFIG_KSU_TRACEPOINT_HOOK

        make olddefconfig

    - name: Build kernel
      working-directory: kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export LD=ld.lld
        export LLVM=1
        export LLVM_IAS=1
        make -j$(nproc)

    - name: Collect artifacts
      run: |
        mkdir artifacts
        cp kernel/out/arch/arm64/boot/Image.gz* artifacts/ || true
        cp kernel/out/arch/arm64/boot/dtbo.img artifacts/ || true

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-lisa-sukisu
        path: artifacts
